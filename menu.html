<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Flames Bite</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="logo">
                <img src="Name_and_address_view_copy-removebg-preview.png" alt="Flames Logo" class="site-logo">
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="cart-nav">
                <button id="cart-btn" aria-label="View cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count">0</span>
                </button>
            </div>
            <button id="theme-switcher" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
            <button class="mobile-menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main>
        <section class="menu-section">
            <h2>Our Menu</h2>
            <div id="menu-categories"></div>
        </section>
    </main>

    <!-- Cart Modal -->
    <div id="cart-modal" class="cart-modal">
        <div class="cart-modal-content">
            <span id="close-cart" class="close-cart">&times;</span>
            <h3>Your Cart</h3>
            <div id="cart-items"></div>
            <div class="cart-total">
                <strong>Total: </strong><span id="cart-total">Rs. 0</span>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>Contact Us</h4>
                <p>Email: info@flamesbite.com</p>
                <p>Phone: (555) 123-4567</p>
            </div>
            <div class="footer-section">
                <h4>Follow Us</h4>
                <div class="social-links">
                    <a href="#"><i class="fab fa-facebook"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 Flames Bite. All rights reserved.</p>
        </div>
    </footer>

    <button id="fab-cart-btn" aria-label="View cart" class="fab-cart-btn">
        <i class="fas fa-shopping-cart"></i>
        <span id="fab-cart-count">0</span>
    </button>

    <!-- Chatbot widget -->
    <div id="chatbot-widget" class="chatbot-widget" aria-live="polite">
        <div class="chatbot-header">
            <div>
                <span class="chatbot-title">Flames Help</span>
                <span class="chatbot-subtitle">Ask about menu, orders, hours</span>
            </div>
            <button id="chatbot-close" aria-label="Close chat"><i class="fas fa-times"></i></button>
        </div>
        <div id="chatbot-messages" class="chatbot-messages"></div>
        <div id="chatbot-quick-replies" class="chatbot-quick-replies"></div>
        <form id="chatbot-form" class="chatbot-form" aria-label="Chat with support">
            <input id="chatbot-input" type="text" placeholder="Type your question..." autocomplete="off">
            <button type="submit" aria-label="Send message"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
    <button id="chatbot-toggle" class="chatbot-toggle" aria-label="Open chat"><i class="fas fa-comments"></i></button>

    <script src="js/main.js"></script>
</body>
</html>
